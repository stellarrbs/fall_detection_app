paths:
  model_dir: weights
  model_path: weights/fall_lstm2.pth
  alert_video_dir: alert_videos

dataset:
  seq_len: 30
  num_keypoints: 33
  features: 3
  step: 5

model:
  hidden_size: 128
  num_layers: 2
  dropout: 0.3

training:
  batch_size: 32
  epochs: 50
  learning_rate: 0.001

inference:
  video_path: "test.mp4"
  camera_index: 0

  # LSTM의 넘어짐 예측 신뢰도 기준
  confidence_threshold: 0.75

  # 넘어짐 이후 움직임 감소 판단 기준
  motion_threshold: 0.015

  # 넘어짐 후보 상태가 유지되어야 하는 시간
  no_motion_seconds: 5

  # 넘어짐 예측 결과가 연속으로 나타나야 하는 프레임 수
  required_fall_frames: 3

  # 사람이 검출되지 않을 때 시퀀스를 초기화하기까지의 시간
  no_pose_reset_seconds: 2

  # 서버 영상 크기 및 송출 품질
  frame_width: 640
  frame_height: 480
  jpeg_quality: 75

  # 골반 중심의 수직 이동 속도 기준
  # 영상 좌표 기준이며, 양수는 화면 아래 방향 이동
  velocity_threshold: 0.8

  # 골반 중심의 수직 가속도 기준
  # 실제 m/s²가 아닌 영상 좌표 기반 상대값
  acceleration_threshold: 8.0

  # 속도 또는 가속도 기준을 넘은 상황을 기억하는 시간
  kinematic_memory_seconds: 1.0

labels:
  normal: 0
  sitting: 1
  lying: 2
  fall: 3

recording:
  enable: true
  fps: 20
  pre_record_seconds: 5
  post_record_seconds: 10

discord:
  enable: true

  # 본인의 Discord Webhook URL 입력
  webhook_url: "YOUR_DISCORD_WEBHOOK_URL"

server:
  host: "0.0.0.0"
  port: 5001
